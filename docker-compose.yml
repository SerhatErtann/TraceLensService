name: tracelens

# İki kullanım:
#   docker compose up -d                  → Geliştirme: sadece ClickHouse + OTel Collector.
#                                           TraceLensService ve dashboard Visual Studio / npm ile çalıştırılır.
#   docker compose --profile app up -d    → Sunucu: yukarıdakilere ek olarak TraceLensService ve dashboard
#                                           da container olarak kalkar. Dashboard: http://<sunucu>:${DASHBOARD_PORT}
#
# Şifreler ve adresler .env dosyasından okunur (bkz. .env.example). .env yoksa yerel geliştirme varsayılanları kullanılır.
# Durdurmak: docker compose --profile app down   (veriler "clickhouse-data" volume'unda kalır)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracelens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tracelens}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      # Yalnızca bu makineden erişilebilir: yerelde çalışan TraceLensService ve http://localhost:8123/play için.
      # Container'lar birbirine Docker ağı üzerinden bağlanır; ClickHouse dışarıya açılmaz.
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    # otel-collector/otel-collector.yaml değişirse: docker compose up -d --build
    build: ./otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracelens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tracelens}
    ports:
      - "4317:4317"   # OTLP gRPC: servisler ölçümleri buraya gönderir (TraceLens:OtlpEndpoint)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  tracelens-service:
    profiles: [app]
    build:
      context: .
      dockerfile: TraceLensService/Dockerfile
    environment:
      ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Username=${CLICKHOUSE_USER:-tracelens};Password=${CLICKHOUSE_PASSWORD:-tracelens};Database=otel"
      Notifications__WebhookUrl: ${NOTIFICATIONS_WEBHOOK_URL:-}
      Notifications__Format: ${NOTIFICATIONS_FORMAT:-teams}
      Notifications__DashboardUrl: ${DASHBOARD_URL:-http://localhost:8080}
      Swagger__IsEnabled: "false"
      # Dashboard girişi. Required=true: AUTH_PASSWORD boşsa servis açılmaz (korumasız yayını engeller)
      Auth__Username: ${AUTH_USERNAME:-admin}
      Auth__Password: ${AUTH_PASSWORD:-}
      Auth__Required: "true"
      # AI asistanı (Claude API anahtarı). Boşsa asistan kapalı görünür
      Ai__ApiKey: ${ANTHROPIC_API_KEY:-}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  tracelens-dashboard:
    profiles: [app]
    # tracelens-frontend reposu bu reponun yanında olmalı (varsayılan ../tracelens-frontend)
    build: ${FRONTEND_DIR:-../tracelens-frontend}
    environment:
      TRACELENS_API_URL: http://tracelens-service:8080
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      - tracelens-service
    restart: unless-stopped

volumes:
  clickhouse-data:
