name: tracelens

# Yerel geliştirme altyapısı: ClickHouse (veritabanı) + OTel Collector (servislerden ölçümleri toplar).
# Başlatmak:  docker compose up -d
# Durdurmak:  docker compose down        (veriler "clickhouse-data" volume'unda kalır)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: tracelens
      CLICKHOUSE_PASSWORD: tracelens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP: TraceLensService buradan okur, http://localhost:8123/play web arayüzü
      - "9000:9000"   # Native: Collector buradan yazar
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "tracelens", "--password", "tracelens", "-q", "SELECT 1"]
      interval: 5s
      retries: 20

  otel-collector:
    # otel-collector/otel-collector.yaml değişirse: docker compose up -d --build
    build: ./otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC (uygulamalar buraya gönderir)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
