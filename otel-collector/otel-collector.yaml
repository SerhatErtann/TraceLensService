receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch:
    send_batch_size: 5000
    timeout: 2s

  # Hacim büyüdüğünde açın: hatalı ve yavaş trace'lerin hepsini, gerisinin bir kısmını saklar.
  # DİKKAT: sampling açıkken ortalama/p95 değerleri yavaşlara doğru kayar; o noktada
  # istatistikleri sampling'den önce "spanmetrics" connector'ü ile üretmek gerekir.
  # tail_sampling:
  #   decision_wait: 10s
  #   policies:
  #     - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
  #     - { name: slow,   type: latency,     latency: { threshold_ms: 200 } }
  #     - { name: rest,   type: probabilistic, probabilistic: { sampling_percentage: 10 } }

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: tracelens
    password: tracelens
    traces_table_name: otel_traces
    create_schema: true
    ttl: 168h          # 7 gün saklanır
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, debug]
